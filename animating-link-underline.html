<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Animating Link Underline</title>
        <style>
            body {
                margin: 0;
            }

            .f-c-c {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .h-20 {
                height: 20rem;
            }

            .container {
                background-color: #f4f4f6;
            }

            .text {
                height: 2.1rem;
                position: relative;
                text-align: center;
                line-height: 2rem;
                padding-bottom: .1rem;
                font-size: 2rem;
            }

            .text::after {
                content: '';
                width: 100%;
                height: 2px;
                position: absolute;
                left: 0;
                bottom: 0;
                background-color: black;
                transform: scaleX(0);
                transition: transform ease-in-out .3s;
            }

            .text:hover::after {
                transform: scaleX(1);
            }

        </style>
    </head>

    <body>
        <ul>
            <li>偽元素</li>
            <li>絕對定位</li>
        </ul>
        <div class="f-c-c h-20 container">
            <div class="text">Hover this text</div>
        </div>
    </body>

</html>
