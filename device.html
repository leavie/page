<html>
  <head>
    <meta http-equiv="Content-Security-Policy" content="frame-src *">
  </head>
  <body>
    memory info:
  </body>
  <script>
    const p = document.createElement('p')
    p.textContent = navigator.deviceMemory
    document.body.append(p)
  </script>
  <textarea id="ta" placeholder="queries...">
    frame;src
  </textarea>
  <button id="btn">query</button>
  
  <script>
    const ALPHA_UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
    function randInt ( n, s = 0 ) { // [s,n)
        return ( ( Math.random() * n ) | 0 ) + s
    }
    // 生成指定長度的包含大寫字母、小寫字母和數字的隨機字符串
    function randString ( characters, length ) {
        return Array( length ).fill().map( _ => randInt( characters.length ) ).map( i => characters.charAt( i ) ).join( '' )
    }
  </script>
  <script>
    const prox = () => {
      const o = window.open
      window.open = (...args) => {
        const w = o.apply(this, args)
        setTimeout(() => w.close(), 2000)
      }
      return () => {
        window.open = o
      }
    }

    
    const bq = () => {
      const ta = document.querySelector('#ta')
      const qs = ta.value.split(/\n|;/).filter(v=>v)
      for (const q of qs) {
        const home = `//www.bing.com/search?q=${q}&FORM=${randString(ALPHA_UPPER,4)}${randInt(10)}`
        window.open(home, '_blank')
      }
    }

    const btn = document.querySelector('#btn')
    btn.addEventListener('click', ()=>{
      const unprox = prox()
      bq()
      unprox()
    })
    
    
  </script>
  <iframe src="https://www.bing.com/search?q=hello" height="2000" width="1500" 
></iframe>
</html>
