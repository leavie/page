<!DOCTYPE html>
<html>
  <head>
    <title>Example Domain</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="frame-src *">
  </head>
  <body>
  <h3>memory info:</h3>  
  <script>
    const p = document.createElement('p')
    p.textContent = navigator.deviceMemory
    document.body.append(p)
  </script>
  <textarea id="ta" placeholder="queries;qa;qb..." style="width:1200px; height:300px"></textarea>
  <button id="query">query</button>
  <button id="stop">stop</button>
  <span id="counter">? <span>input count</span></span>
  <span id="times">? <span>finish times</span></span>
  <iframe id="frame" src="https://www.bing.com/" height="2000" width="1500"></iframe>
  </body>
  <script>
    const ALPHA_UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
    function randInt ( n, s = 0 ) { // [s,s+n)
        return ( ( Math.random() * n ) | 0 ) + s
    }
    // 生成指定長度的包含大寫字母、小寫字母和數字的隨機字符串
    function randString ( characters, length ) {
        return Array( length ).fill().map( _ => randInt( characters.length ) ).map( i => characters.charAt( i ) ).join( '' )
    }
    function timer ( t ) {
      let ct, reject
      return [ new Promise( ( reso, rej ) => {
          reject = rej
          ct = setTimeout( reso, t )
      } ), () => { clearTimeout( ct ); reject() } ]
    }
    const groupPairsAsString = (arr, n=2) => arr.reduce((acc, _, i, a) => (i % n === 0 && acc.push(a.slice(i, i + n).join(" ")), acc), []);
  </script>
  <script>
    const prox = () => {
      const o = open
      open = (...args) => {
        const w = o.apply(null, args)
        setTimeout(() => w.close(), 2000)
        return w
      }
      return () => {
        open = o
      }
    }
    let close
    let times = 0
    const ta = document.querySelector('#ta')
    const frame = document.querySelector('#frame')
    const counterEle = document.querySelector('#counter')
    const timesEle = document.querySelector('#times')
    const bq = async () => {
      const qs = ta.value.split(/\n|;| /).filter(v=>v)
      let p = Promise.resolve()
      const qsg = groupPairsAsString(qs, randInt(2,2)).slice(0,35)
      counterEle.textContent = `${qsg.length}`
      for (const q of qsg) {
        p = p.then(()=>{
          const home = `//www.bing.com/search?q=${q}&FORM=${randString(ALPHA_UPPER,4)}${randInt(10)}`
          //open(home, '_blank') // open in new window
          frame.src = home // load in iframe
          const [p, c] = timer(randInt(5000,5000))
          close = c
          times += 1
          timesEle.textContent = `${times} ` 
          return p
        })
        
        // await timer(randInt(5000,5000))[0]
      }
      return p
    }

    const query = document.querySelector('#query')
    query.addEventListener('click', async ()=>{
      //const unprox = prox()
      await bq()
      //unprox()
    })

    const stop = document.querySelector('#stop')
    stop.addEventListener('click', async ()=>{
      close && close()
    })
    
    
  </script>
</html>
