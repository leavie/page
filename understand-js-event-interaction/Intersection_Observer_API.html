<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intersection_Observer_API</title>
    <style>
        /* stylelint-disable selector-max-id */
        #box {
            position: sticky;
            top: 0;

            justify-content: center;

        }

        .vertical {
            color: #ffffff;
            font: 32px "Arial";
        }

        .extra {
            padding: 20px;
            margin-top: 10px;
            width: 350px;
            height: 350px;
            text-align: center;
            border: 4px solid rgb(20, 20, 120);
        }

    </style>
</head>

<body style="margin: 0">
    <div style="display: flex;">
        <div>
            <div id="box">
                <div class="vertical">
                    Welcome to <strong>The Box!</strong>
                </div>
            </div>
        </div>
        <div class="main">
            <!-- some paragraph -->
            <div style="font-size: 0.5rem;">
              <p id="1">1</p>
              <p id="2">2</p>
              <p id="3">3</p>
              <p id="4">4</p>
              <p id="5">5</p>
              <p id="6">6</p>
              <p id="7">7</p>
              <p id="8">8</p>
              <p id="9">9</p>
              <p id="10">10</p>
              <p id="11">11</p>
              <p id="12">12</p>
              <p id="13">13</p>
              <p id="14">14</p>
              <p id="15">15</p>
              <p id="16">16</p>
              <p id="17">17</p>
              <p id="18">18</p>
              <p id="19">19</p>
              <p id="20">20</p>
              <p id="21">21</p>
              <p id="22">22</p>
              <p id="23">23</p>
              <p id="24">24</p>
              <p id="25">25</p>
              <p id="26">26</p>
              <p id="27">27</p>
              <p id="28">28</p>

            </div>
        </div>
    </div>
    <script>
        const numSteps = 20.0;
        let boxElement;
        let mainElement;
        let pElements;
        let prevRatio = 0.0;
        let increasingColor = "rgba(40, 40, 190, ratio)";
        let decreasingColor = "rgba(190, 40, 40, ratio)";

        // Set things up
        window.addEventListener( "load", ( event ) => {
            boxElement = document.querySelector( "#box" );
            pElements = Array.from( document.querySelectorAll( ".main p" ) );

            createObserver();
        }, false );

        function createObserver () {
            function buildThresholdList () {
                let thresholds = [];
                let numSteps = 100;

                for ( let i = 1.0; i <= numSteps; i++ ) {
                    let ratio = i / numSteps;
                    thresholds.push( ratio );
                }

                thresholds.push( 0 );
                return thresholds;
            }

            let observer;

            let options = {
                root: null,
                threshold: [0]
            };

            function handleIntersect ( entries, observer ) {
                console.log( '--', entries.length );
                entries.forEach( ( entry ) => {
                    if ( entry.intersectionRatio > prevRatio ) {
                        boxElement.style.backgroundColor = increasingColor.replace( "ratio", entry.intersectionRatio );
                    } else {
                        boxElement.style.backgroundColor = decreasingColor.replace( "ratio", entry.intersectionRatio );
                    }
                    console.log( entry.target.textContent, entry.isIntersecting, entry.intersectionRatio )
                    prevRatio = entry.intersectionRatio;

                } );
            }

            observer = new IntersectionObserver( handleIntersect, options );
            // observer.observe(boxElement );
            pElements.forEach( p => observer.observe( p ) );
        }
    </script>
</body>

</html>
